<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>THE K LINK PORTAL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#e8e5df;
  --bg2:#d8d2c8;
  --ink:#151515;
  --sub:#66615b;
  --line:rgba(25,25,25,.13);
  --card:rgba(255,255,255,.62);
  --card2:rgba(255,255,255,.38);
  --gold:#9b7b48;
  --gold2:#c3a46b;
  --shadow:0 30px 90px rgba(24,22,20,.18);
}
body.dark{
  --bg:#11110f;
  --bg2:#24211d;
  --ink:#f1eee8;
  --sub:#aaa39a;
  --line:rgba(255,255,255,.13);
  --card:rgba(31,30,28,.66);
  --card2:rgba(255,255,255,.06);
  --gold:#d4b06f;
  --gold2:#9b7b48;
  --shadow:0 34px 100px rgba(0,0,0,.48);
}
body{
  min-height:100vh;
  font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 22% 14%, rgba(255,255,255,.72), transparent 24%),
    radial-gradient(circle at 78% 18%, rgba(183,159,116,.22), transparent 28%),
    radial-gradient(circle at 50% 90%, rgba(0,0,0,.09), transparent 32%),
    linear-gradient(135deg,var(--bg),var(--bg2));
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(115deg, transparent 0%, rgba(255,255,255,.22) 36%, transparent 37%, transparent 100%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.055) 0 1px, transparent 1px 84px);
  opacity:.7;
}
body.dark::before{opacity:.28}
button,input{font-family:inherit}
a{color:inherit;text-decoration:none}
.wrap{
  position:relative;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:34px 18px;
}
.topbar{
  position:fixed;
  top:22px;
  left:50%;
  transform:translateX(-50%);
  width:min(1120px,calc(100% - 36px));
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:2;
}
.brandmini{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:12px;
  font-weight:900;
  letter-spacing:.28em;
  color:var(--sub);
}
.brandmark{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border:1px solid var(--line);
  background:var(--card2);
  backdrop-filter:blur(16px);
  color:var(--gold);
  font-size:15px;
  font-weight:950;
}
.modebtn{
  height:36px;
  border:1px solid var(--line);
  background:var(--card2);
  color:var(--ink);
  backdrop-filter:blur(16px);
  padding:0 13px;
  font-size:11px;
  font-weight:900;
  letter-spacing:.08em;
  cursor:pointer;
}
.panel{
  width:min(440px,100%);
  position:relative;
  z-index:1;
}
.loginbox{
  position:relative;
  border:1px solid var(--line);
  background:linear-gradient(180deg,var(--card),rgba(255,255,255,.28));
  backdrop-filter:blur(26px);
  box-shadow:var(--shadow);
  padding:42px 34px 30px;
  overflow:hidden;
}
body.dark .loginbox{background:linear-gradient(180deg,var(--card),rgba(20,20,19,.42))}
.loginbox::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  right:0;
  height:3px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),transparent);
}
.loginbox::after{
  content:"THE K";
  position:absolute;
  right:-22px;
  bottom:-18px;
  font-size:74px;
  font-weight:950;
  letter-spacing:.06em;
  color:rgba(155,123,72,.07);
  pointer-events:none;
}
.kicker{
  text-align:center;
  color:var(--gold);
  font-size:11px;
  font-weight:950;
  letter-spacing:.34em;
  margin-bottom:12px;
}
h1{
  text-align:center;
  font-family:Georgia,"Times New Roman",serif;
  font-size:50px;
  line-height:1;
  font-weight:500;
  letter-spacing:.13em;
}
.subtitle{
  margin-top:13px;
  text-align:center;
  color:var(--sub);
  font-size:13px;
  font-weight:750;
  letter-spacing:.06em;
}
.form{
  position:relative;
  z-index:1;
  margin-top:34px;
  display:grid;
  gap:12px;
}
.label{
  font-size:11px;
  font-weight:950;
  color:var(--sub);
  letter-spacing:.16em;
}
.passwordrow{
  display:grid;
  grid-template-columns:1fr auto;
  border:1px solid var(--line);
  background:rgba(255,255,255,.58);
}
body.dark .passwordrow{background:rgba(255,255,255,.055)}
#password{
  width:100%;
  height:50px;
  border:0;
  outline:0;
  background:transparent;
  color:var(--ink);
  padding:0 15px;
  font-size:15px;
  font-weight:850;
}
#password::placeholder{color:rgba(115,108,99,.62)}
body.dark #password::placeholder{color:rgba(220,214,205,.44)}
.showbtn{
  width:50px;
  height:50px;
  border:0;
  border-left:1px solid var(--line);
  background:transparent;
  color:var(--sub);
  font-size:12px;
  font-weight:950;
  cursor:pointer;
}
.loginbtn{
  height:52px;
  border:0;
  background:linear-gradient(135deg,#171717,#383430);
  color:#fff;
  font-size:13px;
  font-weight:950;
  letter-spacing:.16em;
  cursor:pointer;
  transition:.16s ease;
}
body.dark .loginbtn{background:linear-gradient(135deg,#d5b574,#967545);color:#17130e}
.loginbtn:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(0,0,0,.18)}
.msg{
  min-height:20px;
  margin-top:4px;
  color:#a44949;
  font-size:12px;
  font-weight:850;
  text-align:center;
}
.bottom{
  margin-top:20px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  color:var(--sub);
  font-size:12px;
  font-weight:850;
}
.bottom a{border-bottom:1px solid rgba(155,123,72,.55);padding-bottom:2px;color:var(--gold)}
.note{
  margin-top:18px;
  text-align:center;
  color:var(--sub);
  font-size:11px;
  font-weight:750;
  line-height:1.55;
}
@media(max-width:560px){
  .wrap{padding:82px 16px 28px;align-items:start}
  .topbar{top:16px;width:min(100% - 28px,1120px)}
  .brandmini{letter-spacing:.18em;font-size:11px}
  .brandmark{width:31px;height:31px;font-size:13px}
  .modebtn{height:33px;padding:0 10px;font-size:10px}
  .loginbox{padding:34px 24px 26px}
  h1{font-size:42px;letter-spacing:.1em}
  .subtitle{font-size:12px}
  .form{margin-top:28px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brandmini"><span class="brandmark">K</span><span>LINK PORTAL</span></div>
  <button class="modebtn" type="button" id="modeBtn">DARK</button>
</div>
<div class="wrap">
  <section class="panel">
    <div class="loginbox">
      <div class="kicker">PRIVATE ACCESS</div>
      <h1>THE K</h1>
      <p class="subtitle">EXTERNAL LINK COPY SERVICE</p>
      <form class="form" id="loginForm">
        <div class="label">PASSWORD</div>
        <div class="passwordrow">
          <input id="password" type="password" autocomplete="current-password" placeholder="입장 비밀번호를 입력하세요" />
          <button class="showbtn" type="button" id="showBtn">보기</button>
        </div>
        <button class="loginbtn" type="submit">ENTER</button>
        <div class="msg" id="message"></div>
      </form>
      <div class="bottom">
        <span>THE K ONLY</span>
        <a href="/thek/admin/">ADMIN</a>
      </div>
    </div>
    <p class="note">접근 권한이 있는 사용자만 이용할 수 있습니다.<br>비밀번호는 관리자에게 문의하세요.</p>
  </section>
</div>
<script>
const body = document.body;
const modeBtn = document.getElementById("modeBtn");
const savedMode = localStorage.getItem("thekMode") || "light";
if(savedMode === "dark"){
  body.classList.add("dark");
  modeBtn.textContent = "LIGHT";
}
modeBtn.addEventListener("click", () => {
  body.classList.toggle("dark");
  const isDark = body.classList.contains("dark");
  localStorage.setItem("thekMode", isDark ? "dark" : "light");
  modeBtn.textContent = isDark ? "LIGHT" : "DARK";
});
const password = document.getElementById("password");
const showBtn = document.getElementById("showBtn");
showBtn.addEventListener("click", () => {
  const isPassword = password.type === "password";
  password.type = isPassword ? "text" : "password";
  showBtn.textContent = isPassword ? "숨김" : "보기";
});
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = document.getElementById("message");
  const value = password.value.trim();
  if(!value){
    message.textContent = "비밀번호를 입력해주세요.";
    password.focus();
    return;
  }
  message.textContent = "확인 중입니다...";
  try{
    const res = await fetch("/thek/auth", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      credentials:"include",
      body:JSON.stringify({password:value})
    });
    const data = await res.json().catch(() => ({}));
    if(res.ok && data.ok){
      location.href = data.redirect || "/thek/";
      return;
    }
    message.textContent = data.message || "비밀번호가 맞지 않습니다.";
  }catch(err){
    message.textContent = "서버 연결을 확인해주세요.";
  }
});
</script>
</body>
</html>
